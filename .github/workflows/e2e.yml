name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The e2e job doesn't call the GitHub API or push anything - explicit least-privilege
# regardless of the org/repo default token permissions.
permissions:
  contents: read

env:
  CATTLE_BOOTSTRAP_PASSWORD: password
  EXTENSION_SERVER_PORT: "8080"
  TEST_BASE_URL: https://127.0.0.1.sslip.io
  API: https://127.0.0.1.sslip.io

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # catalog.cattle.io/rancher-version in pkg/capa/package.json is >= 2.15.0
        version:
          - { chartVersionPrefix: "2.16", kubeVersion: "v1.36.2+k3s1" }
          - { chartVersionPrefix: "2.15", kubeVersion: "v1.36.2+k3s1" }
    name: "Rancher ${{ matrix.version.chartVersionPrefix }}"
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install packages
        run: yarn install --frozen-lockfile

        # Install Rancher and wait for it to become available
      - name: Start Rancher (Prime alpha, Helm on k3s)
        env:
          CHART_VERSION_PREFIX: ${{ matrix.version.chartVersionPrefix }}
          KUBE_VERSION: ${{ matrix.version.kubeVersion }}
        run: ./scripts/e2e-k3s-start.sh

        # Navigate the initial setup flow: accept EULA, bootstrap password, set server URL
      - name: Bootstrap Rancher
        run: ./scripts/e2e-bootstrap-rancher.sh

        # The CAPA provisioner is only offered when Turtles has the aws CAPIProvider installed
      - name: Install the CAPA provider
        run: ./scripts/e2e-install-capa-provider.sh

        # build the extension from this branch's code, load it into the UI using the 'Developer Load' mechanism
      - name: Build, serve, and register the extension
        run: ./scripts/e2e-create-uiplugin.sh

      - name: Run Cypress
        env:
          TEST_USERNAME: admin
          # `+-@jenkins` excludes suites that need real cloud credentials.
          # @cypress/grep matches a test when ANY of its tags match, so without this
          # a @jenkins spec tagged @adminUser would also run in this gate.
          GREP_TAGS: "@adminUser+-@jenkins"
        run: yarn e2e:ci

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-artifacts-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.version.chartVersionPrefix }}
          path: |
            cypress/screenshots
            cypress/videos
            serve-pkgs.log
          if-no-files-found: ignore
